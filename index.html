<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading Mock Test Platform</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f1f5f9; color: #1e293b; }

    /* Creator Mode */
    .creator-container { max-width: 800px; margin: 40px auto; padding: 24px; background: white; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .creator-container h1 { margin-bottom: 20px; color: #0f172a; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; }
    input[type="text"], textarea, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; margin-bottom: 8px; }
    textarea { height: 120px; resize: vertical; }
    
    .q-card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 16px; border-radius: 6px; margin-bottom: 16px; }
    .opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
    
    .btn { padding: 10px 20px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #64748b; color: white; margin-bottom: 20px; }
    
    #share-link-box { display: none; margin-top: 20px; padding: 16px; background: #e0f2fe; border: 1px solid #bae6fd; border-radius: 6px; }
    #share-url { width: 100%; margin-top: 8px; font-weight: bold; background: white; cursor: pointer; }

    /* Test Taking Mode */
    #test-view { display: none; height: 100vh; flex-direction: column; }
    header { height: 60px; background-color: #0f172a; color: #ffffff; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; }
    #timer { font-size: 1.1rem; font-weight: bold; background-color: #ef4444; padding: 6px 14px; border-radius: 4px; }

    .test-body { display: flex; flex: 1; overflow: hidden; }
    .passage-panel, .question-panel { flex: 1; padding: 24px; overflow-y: auto; }
    .passage-panel { border-right: 2px solid #e2e8f0; background-color: #ffffff; line-height: 1.7; }
    .question-panel { background-color: #f8fafc; }
    
    .test-q-block { background: white; padding: 16px; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 16px; }
    .test-q-block p { font-weight: 600; margin-bottom: 12px; }
    .test-q-block label { display: block; font-weight: normal; margin-bottom: 6px; cursor: pointer; }
    .blank-input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 14px; }

    #result-box { display: none; margin-top: 20px; padding: 16px; background-color: #dcfce7; border: 1px solid #86efac; border-radius: 6px; color: #166534; font-weight: bold; }
    #loading-screen { display: flex; height: 100vh; justify-content: center; align-items: center; font-size: 1.2rem; font-weight: bold; }
  </style>
</head>
<body>

  <!-- LOADING SCREEN -->
  <div id="loading-screen" style="display: none;">Loading reading test...</div>

  <!-- CREATOR MODE -->
  <div id="creator-view" class="creator-container">
    <h1>Create Reading Test</h1>
    
    <div class="form-group">
      <label for="p-title">Passage Title</label>
      <input type="text" id="p-title" placeholder="e.g., Passage 3: The Science of Kissing">
    </div>

    <div class="form-group">
      <label for="p-text">Passage Text</label>
      <textarea id="p-text" placeholder="Paste reading passage here..."></textarea>
    </div>

    <h3>Questions</h3>
    <div id="questions-list"></div>

    <button class="btn btn-secondary" onclick="addQuestionField()">+ Add Question</button>
    <br>
    <button class="btn btn-primary" id="gen-btn" onclick="generateShareLink()">Generate Shareable Link</button>

    <div id="share-link-box">
      <strong>Your test is ready! Share this short link:</strong>
      <input type="text" id="share-url" readonly onclick="copyLink()">
    </div>
  </div>

  <!-- TEST TAKING MODE -->
  <div id="test-view">
    <header>
      <h2 id="display-title">Reading Test</h2>
      <div id="timer">20:00</div>
    </header>

    <div class="test-body">
      <div class="passage-panel">
        <h2 id="passage-heading" style="margin-bottom: 16px;"></h2>
        <div id="passage-content"></div>
      </div>

      <div class="question-panel">
        <form id="test-form">
          <div id="test-questions-container"></div>
          <button type="button" class="btn btn-primary" style="width: 100%;" onclick="submitTest()">Submit Test</button>
        </form>
        <div id="result-box"></div>
      </div>
    </div>
  </div>

  <script>
    // Paste your JSONBin Master Key here inside the quotes:
    const JSONBIN_MASTER_KEY = "$2a$10$2EI9sA6dGswtflh4vof3nOddKUdQ3xKv/SSAJVPxcB6gm9UduFtUu";

    let qCount = 0;
    let currentTestData = null;
    let timerInterval = null;

    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const testId = urlParams.get('id');

      if (testId) {
        document.getElementById('creator-view').style.display = 'none';
        document.getElementById('loading-screen').style.display = 'flex';
        fetchTestFromDatabase(testId);
      } else {
        addQuestionField();
      }
    };

    function addQuestionField() {
      qCount++;
      const div = document.createElement('div');
      div.className = 'q-card';
      div.id = `q-card-${qCount}`;
      div.innerHTML = `
        <label>Question ${qCount}</label>
        <label style="font-weight: normal; font-size: 13px;">Question Type:</label>
        <select class="q-type" onchange="toggleQType(this, ${qCount})">
          <option value="tfng">True / False / Not Given</option>
          <option value="fill">Fill in the Blank</option>
          <option value="mcq">Multiple Choice</option>
        </select>
        
        <input type="text" class="q-txt" placeholder="Enter question statement or prompt" required>
        
        <div id="tfng-box-${qCount}">
          <label style="font-weight: normal; font-size: 13px;">Correct Answer:</label>
          <select class="correct-tfng">
            <option value="TRUE">TRUE</option>
            <option value="FALSE">FALSE</option>
            <option value="NOT GIVEN">NOT GIVEN</option>
          </select>
        </div>

        <div id="fill-box-${qCount}" style="display:none;">
          <input type="text" class="correct-blank" placeholder="Exact correct answer word/phrase">
        </div>

        <div id="mcq-box-${qCount}" style="display:none;">
          <div class="opt-grid">
            <input type="text" class="opt-a" placeholder="Option A">
            <input type="text" class="opt-b" placeholder="Option B">
            <input type="text" class="opt-c" placeholder="Option C">
            <input type="text" class="opt-d" placeholder="Option D">
          </div>
          <label style="font-weight: normal; font-size: 13px;">Correct Choice:</label>
          <select class="correct-mcq">
            <option value="A">Option A</option>
            <option value="B">Option B</option>
            <option value="C">Option C</option>
            <option value="D">Option D</option>
          </select>
        </div>
      `;
      document.getElementById('questions-list').appendChild(div);
    }

    function toggleQType(selectEl, qId) {
      const tfngBox = document.getElementById(`tfng-box-${qId}`);
      const fillBox = document.getElementById(`fill-box-${qId}`);
      const mcqBox = document.getElementById(`mcq-box-${qId}`);
      
      tfngBox.style.display = 'none';
      fillBox.style.display = 'none';
      mcqBox.style.display = 'none';

      if (selectEl.value === 'tfng') {
        tfngBox.style.display = 'block';
      } else if (selectEl.value === 'fill') {
        fillBox.style.display = 'block';
      } else {
        mcqBox.style.display = 'block';
      }
    }

    async function generateShareLink() {
      const title = document.getElementById('p-title').value.trim();
      const text = document.getElementById('p-text').value.trim();
      const btn = document.getElementById('gen-btn');
      
      if (!title || !text) {
        alert("Please fill in both the passage title and content.");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Saving test to cloud...";

      const questions = [];
      const qCards = document.querySelectorAll('.q-card');

      qCards.forEach((card, idx) => {
        const type = card.querySelector('.q-type').value;
        if (type === 'tfng') {
          questions.push({
            id: `q${idx + 1}`,
            type: 'tfng',
            q: card.querySelector('.q-txt').value,
            ans: card.querySelector('.correct-tfng').value
          });
        } else if (type === 'fill') {
          questions.push({
            id: `q${idx + 1}`,
            type: 'fill',
            q: card.querySelector('.q-txt').value,
            ans: card.querySelector('.correct-blank').value.trim().toLowerCase()
          });
        } else {
          questions.push({
            id: `q${idx + 1}`,
            type: 'mcq',
            q: card.querySelector('.q-txt').value,
            opts: [
              card.querySelector('.opt-a').value,
              card.querySelector('.opt-b').value,
              card.querySelector('.opt-c').value,
              card.querySelector('.opt-d').value
            ],
            ans: card.querySelector('.correct-mcq').value
          });
        }
      });

      const testData = { title, text, questions };

      try {
        const response = await fetch('https://api.jsonbin.io/v3/b', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': JSONBIN_MASTER_KEY
          },
          body: JSON.stringify(testData)
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'Error saving test');

        const binId = data.metadata.id;
        const shareUrl = `${window.location.origin}${window.location.pathname}?id=${binId}`;
        
        document.getElementById('share-url').value = shareUrl;
        document.getElementById('share-link-box').style.display = 'block';
      } catch (err) {
        alert("Failed to save test. Please check your JSONBin Master Key.");
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = "Generate Shareable Link";
      }
    }

    function copyLink() {
      const copyText = document.getElementById("share-url");
      copyText.select();
      copyText.setSelectionRange(0, 99999);
      navigator.clipboard.writeText(copyText.value);
      alert("Short test link copied to clipboard!");
    }

    async function fetchTestFromDatabase(binId) {
      try {
        const response = await fetch(`https://api.jsonbin.io/v3/b/${binId}`, {
          method: 'GET',
          headers: {
            'X-Master-Key': JSONBIN_MASTER_KEY
          }
        });

        const data = await response.json();
        if (!response.ok) throw new Error("Test not found");

        currentTestData = data.record;

        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('test-view').style.display = 'flex';

        document.getElementById('display-title').textContent = currentTestData.title;
        document.getElementById('passage-heading').textContent = currentTestData.title;
        document.getElementById('passage-content').innerHTML = `<p>${currentTestData.text.replace(/\n/g, '<br><br>')}</p>`;

        const qContainer = document.getElementById('test-questions-container');
        qContainer.innerHTML = '';

        currentTestData.questions.forEach((q, idx) => {
          const block = document.createElement('div');
          block.className = 'test-q-block';
          
          if (q.type === 'tfng') {
            block.innerHTML = `
              <p>${idx + 1}. ${q.q}</p>
              <label><input type="radio" name="${q.id}" value="TRUE"> TRUE</label>
              <label><input type="radio" name="${q.id}" value="FALSE"> FALSE</label>
              <label><input type="radio" name="${q.id}" value="NOT GIVEN"> NOT GIVEN</label>
            `;
          } else if (q.type === 'fill') {
            block.innerHTML = `
              <p>${idx + 1}. ${q.q}</p>
              <input type="text" name="${q.id}" class="blank-input" placeholder="Type your answer here">
            `;
          } else {
            block.innerHTML = `
              <p>${idx + 1}. ${q.q}</p>
              <label><input type="radio" name="${q.id}" value="A"> A) ${q.opts[0]}</label>
              <label><input type="radio" name="${q.id}" value="B"> B) ${q.opts[1]}</label>
              <label><input type="radio" name="${q.id}" value="C"> C) ${q.opts[2]}</label>
              <label><input type="radio" name="${q.id}" value="D"> D) ${q.opts[3]}</label>
            `;
          }
          qContainer.appendChild(block);
        });

        startTimer(20 * 60);
      } catch (e) {
        document.getElementById('loading-screen').style.display = 'none';
        alert("Invalid or expired test link.");
      }
    }

    function startTimer(secondsLeft) {
      const timerEl = document.getElementById('timer');
      timerInterval = setInterval(() => {
        let mins = Math.floor(secondsLeft / 60);
        let secs = secondsLeft % 60;
        timerEl.textContent = `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
        
        if (secondsLeft <= 0) {
          clearInterval(timerInterval);
          alert("Time's up! Submitting test.");
          submitTest();
        }
        secondsLeft--;
      }, 1000);
    }

    function submitTest() {
      clearInterval(timerInterval);
      let score = 0;
      const total = currentTestData.questions.length;

      currentTestData.questions.forEach(q => {
        if (q.type === 'tfng' || q.type === 'mcq') {
          const selected = document.querySelector(`input[name="${q.id}"]:checked`);
          if (selected && selected.value === q.ans) {
            score++;
          }
        } else if (q.type === 'fill') {
          const userInput = document.querySelector(`input[name="${q.id}"]`).value.trim().toLowerCase();
          if (userInput === q.ans) {
            score++;
          }
        }
      });

      const resultBox = document.getElementById('result-box');
      resultBox.style.display = 'block';
      resultBox.innerHTML = `
        <h3>Test Completed!</h3>
        <p style="margin-top:8px;">Your Score: <strong>${score} / ${total}</strong> (${Math.round((score/total)*100)}%)</p>
      `;
    }
  </script>
</body>
</html>
